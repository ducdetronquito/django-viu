[[repos]]
repo = "builtin"
hooks = [
    {
        id = "trailing-whitespace",
    },
    {
        id = "end-of-file-fixer",
    },
    {
        id = "check-merge-conflict",
    },
    {
        id = "check-toml",
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "ruff-format",
        name = "ruff-format",
        language = "system",
        entry = "poetry run ruff format",
        files = "\\.py$",
    },
    {
        id = "ruff-check",
        name = "ruff-check",
        language = "system",
        entry = "poetry run ruff check",
        files = "\\.py$",
    },
    {
        id = "typechecker",
        name = "typechecker",
        language = "system",
        entry = "poetry run pyrefly check",
        files = "\\.py$",
    },
    {
        id = "tests",
        name = "tests",
        language = "system",
        entry = "poetry run pytest",
        always_run = true,
        pass_filenames = false
    },
]
